name: CI Testing

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: example_fastapi_app-main

jobs:
  test:
    timeout-minutes: 10 
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run Tests
        run: |
          pytest .
