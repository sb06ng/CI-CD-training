name: CI Testing

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest  
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r example_fastapi_app-main/requirements.txt
          pip install pytest httpx

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/example_fastapi_app-main/example_fastapi_app
        run: |
          pytest example_fastapi_app-main/tests